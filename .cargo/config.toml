# On macOS, extension-module symbols must be left for the Python interpreter to provide at
# runtime; otherwise a bare `cargo build` can't find the _Py* symbols at link time. maturin adds
# this itself, but `cargo build` / `cargo clippy` don't, so it is pinned here.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
