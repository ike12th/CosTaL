[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
# The main targets are macos-arm64 and linux-x86_64; x86_64-apple-darwin is here because the
# local anaconda interpreter is an Intel build (running under Rosetta) and needs it to install
# the extension.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
