[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "costal-plus"
version = "0.1.0"
description = "A high-performance rewrite of CosTaL: cosine kNN graph -> Tanimoto edge reweighting -> Leiden community detection"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yijia Li" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# for profiling / benchmarks; not needed by people installing the wheel
bench = ["scipy", "igraph", "leidenalg", "hnswlib", "scikit-learn", "pandas"]
dev = ["pytest", "maturin>=1.7", "scipy"]

[project.urls]
Homepage = "https://github.com/ike12th/costal-plus"
"Original CosTaL" = "https://github.com/li000678/CosTaL"
Paper = "https://doi.org/10.1093/bib/bbad157"

[project.scripts]
costal-plus = "costal_plus.cli:main"

[tool.maturin]
manifest-path = "crates/costal-py/Cargo.toml"
module-name = "costal_plus._costal_plus"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
