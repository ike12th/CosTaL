[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "costal-plus"
version = "1.0.0"
description = "Fast, exact graph-based clustering for single-cell data: CosTaL (cosine kNN, Tanimoto edge weights, Leiden) in Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yijia Li" }]
requires-python = ">=3.9"
keywords = ["single-cell", "clustering", "cytometry", "CyTOF", "flow cytometry", "scRNA-seq", "kNN graph", "Leiden", "Tanimoto"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# find_communities(), find_communities_multiscale(), costal-plus cluster: igraph; leidenalg for leiden="paper"
leiden = ["igraph", "leidenalg"]
# preprocess(platform="scrnaseq"): scanpy, and scikit-misc for the seurat_v3 HVG selection
scrnaseq = ["scanpy", "scikit-misc"]
# costal-plus cluster: CSV/TSV, FCS and .h5ad readers
io = ["pandas", "fcsparser", "anndata"]
all = ["costal-plus[leiden,scrnaseq,io]"]
# benchmarks under bench/; not needed by users
bench = ["scipy", "igraph", "leidenalg", "hnswlib", "scikit-learn", "pandas"]
dev = ["pytest", "maturin>=1.7", "scipy", "scikit-learn"]

[project.urls]
Homepage = "https://github.com/ike12th/costal-plus"
Documentation = "https://github.com/ike12th/costal-plus/blob/main/docs/user_guide.md"
Changelog = "https://github.com/ike12th/costal-plus/blob/main/CHANGELOG.md"
Issues = "https://github.com/ike12th/costal-plus/issues"
"Original CosTaL" = "https://github.com/li000678/CosTaL"
Paper = "https://doi.org/10.1093/bib/bbad157"

[project.scripts]
costal-plus = "costal_plus.cli:main"

[tool.maturin]
manifest-path = "crates/costal-py/Cargo.toml"
module-name = "costal_plus._costal_plus"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
