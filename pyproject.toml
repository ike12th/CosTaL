[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "CosTaL"
version = "2.0.0"
description = "Fast, exact graph-based clustering for single-cell data: exact cosine kNN, Tanimoto edge weights, Leiden"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yijia Li" }]
requires-python = ">=3.9"
keywords = ["single-cell", "clustering", "cytometry", "CyTOF", "flow cytometry", "scRNA-seq", "kNN graph", "Leiden", "Tanimoto"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Everything the package does is installed with it. Windows on Arm has no wheels yet for leidenalg,
# scanpy's numba, scikit-misc or anndata's numcodecs: there the kNN, graph, leiden="fast" and FCS / CSV
# input work and those packages are skipped. FCS files are read by CosTaL itself (fcsparser pins
# numpy < 2).
dependencies = [
    "numpy>=1.21; python_version >= '3.10'",
    # scikit-misc 0.3, the last release for Python 3.9, is built against numpy 1.x
    "numpy>=1.21,<2; python_version < '3.10'",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "igraph>=0.10",
    "leidenalg>=0.8; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "scanpy>=1.9; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "scikit-misc>=0.2; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "anndata>=0.8; platform_system != 'Windows' or platform_machine != 'ARM64'",
]

[project.optional-dependencies]
# benchmarks under bench/ and development; not needed by users
bench = ["hnswlib", "fcsparser"]
dev = ["pytest", "maturin>=1.7"]

[project.urls]
Homepage = "https://github.com/ike12th/CosTaL"
Documentation = "https://github.com/ike12th/CosTaL/blob/main/docs/user_guide.md"
Changelog = "https://github.com/ike12th/CosTaL/blob/main/CHANGELOG.md"
Issues = "https://github.com/ike12th/CosTaL/issues"
"CosTaL 1.0 source" = "https://github.com/li000678/CosTaL"
Paper = "https://doi.org/10.1093/bib/bbad157"

[project.scripts]
costal = "costal.cli:main"

[tool.maturin]
manifest-path = "crates/costal-py/Cargo.toml"
module-name = "costal._costal"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
# 1.0's import name: a one-file alias of the costal package, at the top level of the wheel
include = [{ path = "python/CosTaL.py", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
