name: golden

# Manual: run the p_knng_Linux binary bundled with the original CosTaL on x86-64 Linux to get the
# L3 golden output and compare it with CosTaL 1.0 (docs/04 §4). The dev machine is macOS arm64 and
# can't run this binary; GitHub's ubuntu runner can. Answers two open items: the .clu index base
# (-writeZidx vs the original's columns − 1), and self-exclusion with duplicate cells.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Levine subsample sizes, space-separated; each runs both deduplicated and raw"
        type: string
        default: "20000 50000"
      clip:
        description: "clip negative values to 0 first (pl2knng assumes non-negative input)"
        type: boolean
        default: false

jobs:
  pknng:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: bench/data
          key: levine-32dim-v1
      - run: pip install --upgrade pip maturin numpy scipy pandas scikit-learn igraph leidenalg fcsparser phenograph numba umap-learn
      - run: pip install .
      - run: python bench/fetch_reference.py
      - name: p_knng runtime environment
        run: |
          uname -m
          file bench/reference/CosTaL-0.0.2.4/CosTaL/p_knng_Linux
          ldd bench/reference/CosTaL-0.0.2.4/CosTaL/p_knng_Linux
      - name: run p_knng and compare
        env:
          SIZES: ${{ inputs.sizes }}
          GOLDEN_CLIP: ${{ inputs.clip && '1' || '0' }}
        run: python bench/golden_pknng.py $SIZES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-pknng
          path: |
            bench/out/golden_pknng*.json
            bench/out/golden/*.clu
          retention-days: 30
