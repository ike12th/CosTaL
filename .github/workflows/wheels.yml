name: wheels

# The delivery form is "works after `pip install`" (docs/01 §3). The target machines are
# macos-arm64 and linux-x86_64, but wheels cover every platform we can, so callers never have to
# pick an environment. abi3-py39: one wheel per platform covers CPython 3.9+.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml", "Cargo.toml"]

jobs:
  build:
    name: ${{ matrix.platform.runner }} / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `test`: the wheel is installed and the test suite run on the runner, including the
        # fixed-partition digests of tests/test_leiden_native.py, so every tested platform must give
        # bit-identical results. Not tested: Intel macOS (cross-compiled on Apple silicon; GitHub is
        # retiring its Intel macOS runners) and musl (several dependencies publish no musl wheels).
        platform:
          - { runner: macos-14,         target: aarch64-apple-darwin,       manylinux: auto,          test: true }
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   manylinux: "2_17",        test: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  manylinux: "2_17",        test: true }
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc,     manylinux: auto,          test: true }
          - { runner: windows-11-arm,   target: aarch64-pc-windows-msvc,    manylinux: auto,          test: true }
          - { runner: macos-14,         target: x86_64-apple-darwin,        manylinux: auto,          test: false }
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2, test: false }
          - { runner: ubuntu-latest,    target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: "true"
      - name: test the wheel
        if: ${{ matrix.platform.test }}
        shell: bash
        run: |
          # the wheel's metadata pulls in every runtime dependency, as for users
          pip install --find-links dist CosTaL pytest
          python -c "import costal, CosTaL; print(costal.hello()); assert CosTaL.find_communities is costal.find_communities"
          costal info
          # run from outside the source tree so the installed wheel is what gets tested
          cp -r tests examples packaging bench pyproject.toml "$RUNNER_TEMP/" && cd "$RUNNER_TEMP"
          python -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  attach:
    # Runs only when a maintainer publishes a GitHub release: attaches this tag's wheels and sdist
    # to the release, so they can be installed from there as well as from PyPI.
    name: attach to the GitHub release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    # Runs only when a maintainer publishes a GitHub release: uploads this tag's wheels and sdist to
    # PyPI through trusted publishing (no token in the repository; docs/release/checklist.md).
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
