name: wheels

# The delivery form is "works after `pip install`" (docs/01 §3). The target machines are
# macos-arm64 and linux-x86_64, but wheels cover every platform we can, so callers never have to
# pick an environment. abi3-py39: one wheel per platform covers CPython 3.9+.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml", "Cargo.toml"]

jobs:
  build:
    name: ${{ matrix.platform.runner }} / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ---- primary targets ----
          - { runner: macos-14,       target: aarch64-apple-darwin,       manylinux: auto }
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   manylinux: "2_17" }
          # ---- additional coverage ----
          # Intel macOS: cross-compiled on Apple silicon (GitHub is retiring its Intel macOS runners)
          - { runner: macos-14,       target: x86_64-apple-darwin,        manylinux: auto }
          - { runner: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  manylinux: "2_17" }
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest,  target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc,     manylinux: auto }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc,    manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: "true"
      - name: test the wheel (native targets only)
        # Cross-compiled wheels can't run on the runner; skip them.
        if: ${{ !contains(matrix.platform.target, 'aarch64-unknown-linux') && !contains(matrix.platform.target, 'musl') && !(contains(matrix.platform.target, 'x86_64-apple') && contains(matrix.platform.runner, 'macos-14')) }}
        shell: bash
        run: |
          pip install --find-links dist --force-reinstall costal-plus
          python -c "import costal_plus; print(costal_plus.hello())"
          costal-plus info
          # the optional dependencies may lack wheels on some platforms; their tests then skip
          pip install pytest scipy scikit-learn pandas || true
          pip install igraph leidenalg || true
          # run from outside the source tree so the installed wheel is what gets tested
          cp -r tests examples packaging bench pyproject.toml "$RUNNER_TEMP/" && cd "$RUNNER_TEMP"
          python -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    # Runs only when a maintainer publishes a GitHub release: uploads this tag's wheels and sdist to
    # PyPI through trusted publishing (no token in the repository; docs/release/checklist.md).
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
