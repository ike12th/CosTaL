name: CI

# Actions minutes are budgeted for this private repo: Linux counts 1x, Windows 2x, macOS 10x.
# So routine pushes run Linux only; macOS / Windows run on manual dispatch (with all_os) and on
# v* tags. macOS arm64 is also covered by local development (scripts/dev.sh). Commits that only
# touch docs, reports or research notes don't trigger CI.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "reports/**", "research_notes/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "reports/**", "research_notes/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      all_os:
        description: "also run macOS and Windows (minutes count 10x / 2x)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ALL_OS: '["ubuntu-latest", "macos-14", "windows-latest"]'
  LINUX_ONLY: '["ubuntu-latest"]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          WANT_ALL: ${{ (github.event_name == 'workflow_dispatch' && inputs.all_os) || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$WANT_ALL" = "true" ]; then echo "os=$ALL_OS" >> "$GITHUB_OUTPUT"; else echo "os=$LINUX_ONLY" >> "$GITHUB_OUTPUT"; fi

  rust:
    name: rust / ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # scipy: tests/test_knn.py compares bit for bit against the original scipy symmetrization
      - run: pip install --upgrade pip maturin pytest numpy scipy
      # Optional: the find_communities tests skip if these have no wheel for this platform
      - run: pip install igraph leidenalg || echo "igraph/leidenalg unavailable; their tests will skip"
      # scikit-misc 0.3.1 (the last for Python 3.9) is built against numpy 1.x
      - run: pip install scanpy scikit-misc ${{ matrix.python == '3.9' && '"numpy<2"' || '' }} || echo "scanpy/scikit-misc unavailable; the scRNA-seq preprocess tests will skip"
      - run: pip install -e . --no-build-isolation
      - run: pytest -q
      - run: costal-plus info
