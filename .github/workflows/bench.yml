name: bench

# Manual: run the stage A benchmarks on GitHub's x86-64 Linux machines to get numbers for the
# pure-Rust gemm backend on x86 (docs/06 §3). Timings on shared runners are noisy; use them for
# orders of magnitude and relative conclusions on x86 only. M1 numbers are still measured locally.
# Results go to bench/out/stage_a.linux-x86_64.json, uploaded as an artifact and kept apart from
# the local numbers in the repo.

on:
  workflow_dispatch:
    inputs:
      commands:
        description: "bench/stage_a.py subcommands, space-separated (sweep speed parity full dup-effect ...)"
        type: string
        default: "sweep speed parity"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STAGE_A_OUT: bench/out/stage_a.linux-x86_64.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: bench/data
          key: levine-32dim-v1
      # The original CosTaL clustering.py needs numba / umap / phenograph at import time
      - run: pip install --upgrade pip maturin numpy scipy pandas scikit-learn igraph leidenalg fcsparser phenograph numba umap-learn
      - run: pip install .
      - run: python bench/fetch_reference.py
      - run: lscpu | head -20 && free -g
      - name: run benchmarks
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          for c in $COMMANDS; do
            echo "::group::stage_a.py $c"
            python bench/stage_a.py "$c"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage_a-linux-x86_64
          path: bench/out/stage_a.linux-x86_64.json
          retention-days: 30
