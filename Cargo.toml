[workspace]
resolver = "2"
members = ["crates/costal-core", "crates/costal-py"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/ike12th/CosTaL"
authors = ["Yijia Li"]

[workspace.dependencies]
costal-core = { path = "crates/costal-core", version = "2.0.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# NOTE: no panic="abort" — a Rust panic must unwind back into PyO3,
# otherwise a panic in the extension kills the whole Python interpreter.
